<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — LaunchPad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">🚀 LaunchPad</a>
        <div class="nav-links">
            <a href="login.html">Already have an account? Login</a>
        </div>
    </nav>

    <!-- SIGNUP FORM -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the startup ecosystem today</p>

            <!-- Error / Success messages -->
            <div class="alert alert-error" id="errorMsg"></div>
            <div class="alert alert-success" id="successMsg"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" />
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" />
            </div>

            <div class="form-group">
                <label>I am a...</label>
                <select id="role">
                    <option value="founder">🚀 Founder</option>
                    <option value="investor">💼 Investor</option>
                </select>
            </div>

            <button class="btn-primary" onclick="handleSignup()">Create Account</button>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>

</body>
</html>
