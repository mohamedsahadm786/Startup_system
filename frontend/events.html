<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Networking — LaunchPad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">🚀 LaunchPad</a>
        <div class="nav-links">
            <span id="welcomeMsg" style="color:#aaa; margin-right:16px;"></span>
            <a href="javascript:void(0)" onclick="goToDashboard()">Dashboard</a>
            <button class="btn-nav" onclick="logout()"
                style="margin-left:16px; border:none; cursor:pointer;">Logout</button>
        </div>
    </nav>

    <div class="dashboard">

        <!-- HEADER -->
        <div class="dashboard-header">
            <h1>Events & Networking</h1>
        </div>

        <!-- ALERTS -->
        <div class="alert alert-error" id="errorMsg"></div>
        <div class="alert alert-success" id="successMsg"></div>

        <!-- ── SECTION 1: CREATE EVENT ── -->
        <div class="section-title">📅 Create an Event</div>
        <div class="dashboard-form">
            <input type="text" id="eventTitle"
                placeholder="Event Title (e.g. Abu Dhabi Startup Summit)" />
            <input type="text" id="eventDate"
                placeholder="Event Date (e.g. 2026-04-15)" />
            <input type="text" id="eventLocation"
                placeholder="Location (e.g. Space42 Arena, Abu Dhabi)" />
            <textarea id="eventDescription"
                placeholder="Describe the event..."></textarea>
            <button class="btn-primary" onclick="createEvent()">
                📅 Create Event
            </button>
        </div>

        <!-- ── SECTION 2: ALL EVENTS ── -->
        <div class="section-title" style="margin-top:40px;">🗓️ All Events</div>
        <div id="eventsList" class="grid-2">
            <div class="loading">Loading events...</div>
        </div>

        <!-- ── SECTION 3: FOUNDER NETWORKING ── -->
        <!-- Only visible to founders -->
        <div id="networkingSection" style="display:none;">

            <div class="section-title" style="margin-top:40px;">
                🤝 Connect with Founders
            </div>
            <div class="dashboard-form">
                <h3 style="color:#fff; margin-bottom:16px;">
                    Send Connection Request
                </h3>
                <input type="number" id="receiverId"
                    placeholder="Enter the User ID of the founder you want to connect with" />
                <button class="btn-primary" onclick="sendConnection()">
                    🤝 Send Request
                </button>
            </div>

            <!-- Pending Requests -->
            <div class="section-title" style="margin-top:32px;">
                ⏳ Pending Requests (Received)
            </div>
            <div id="pendingList" class="grid-2">
                <div class="loading">Loading...</div>
            </div>

            <!-- My Connections -->
            <div class="section-title" style="margin-top:32px;">
                ✅ My Connections
            </div>
            <div id="myConnectionsList" class="grid-2">
                <div class="loading">Loading...</div>
            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
    <script src="js/connections.js"></script>

</body>
</html>
