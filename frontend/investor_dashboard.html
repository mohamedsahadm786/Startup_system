<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard — LaunchPad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">🚀 LaunchPad</a>
        <div class="nav-links">
            <span id="welcomeMsg" style="color:#aaa; margin-right:16px;"></span>
            <a href="events.html">Events</a>
            <button class="btn-nav" onclick="logout()"
                style="margin-left:16px; border:none; cursor:pointer;">Logout</button>
        </div>
    </nav>

    <div class="dashboard">

        <!-- HEADER -->
        <div class="dashboard-header">
            <h1>Investor Dashboard</h1>
        </div>

        <!-- ALERTS -->
        <div class="alert alert-error" id="errorMsg"></div>
        <div class="alert alert-success" id="successMsg"></div>

        <!-- ── SECTION 1: MY INVESTOR PROFILE ── -->
        <div class="section-title">💼 My Investor Profile</div>

        <!-- Create / Edit Profile Form -->
        <div class="dashboard-form" id="investorForm">
            <h3 style="color:#fff; margin-bottom:16px;" id="investorFormTitle">
                Create Your Investor Profile
            </h3>
            <input type="text" id="firmName" placeholder="Firm Name (e.g. Gulf Ventures)" />
            <input type="text" id="focusAreas" placeholder="Focus Areas (e.g. AI, FinTech, HealthTech)" />
            <input type="text" id="ticketSize" placeholder="Ticket Size (e.g. $50k - $500k)" />
            <textarea id="bio" placeholder="Tell founders about yourself..."></textarea>
            <button class="btn-primary" onclick="saveInvestorProfile()">
                Save Profile
            </button>
        </div>

        <!-- Investor Profile Card -->
        <div id="investorCard" class="card" style="display:none;">
            <h3 id="cardFirmName"></h3>
            <p style="color:#aaa; font-size:13px; margin-top:6px;">
                🎯 Focus: <span id="cardFocusAreas"></span>
            </p>
            <p style="color:#aaa; font-size:13px; margin-top:4px;">
                💰 Ticket Size: <span id="cardTicketSize"></span>
            </p>
            <p style="color:#ccc; font-size:14px; margin-top:12px;" id="cardBio"></p>
            <button class="btn-secondary" onclick="editInvestorProfile()"
                style="margin-top:16px;">✏️ Edit Profile</button>
        </div>

        <!-- ── SECTION 2: ALL STARTUPS ── -->
        <div class="section-title" style="margin-top:40px;">
            🚀 Discover Startups
        </div>
        <div id="startupsList" class="grid-2">
            <div class="loading">Loading startups...</div>
        </div>

        <!-- ── SECTION 3: ALL INVESTORS ── -->
        <div class="section-title" style="margin-top:40px;">
            💼 All Investors
        </div>
        <div id="investorsList" class="grid-2">
            <div class="loading">Loading investors...</div>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/investors.js"></script>

</body>
</html>
